name: Update Curated EPG

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iptv-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build curated XMLTV
        run: python scripts/build_favorites_guide.py

      - name: Refresh confirmed Flex guide
        run: cp guide-favorites.xml guide-flex-20261003.xml

      - name: Validate
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path("guide-favorites.xml")
          root=ET.parse(p).getroot()
          ch=len(root.findall("channel"))
          pr=len(root.findall("programme"))
          print(f"{ch} channels / {pr} programmes / {p.stat().st_size/1024/1024:.2f} MB")
          if ch == 0 or pr == 0:
              raise SystemExit("Filtered guide is empty")
          PY

      - name: Keep generated guide for review only
        run: |
          echo "The coordinated six-hour workflow is the sole publisher."
