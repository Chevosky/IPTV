name: Zapper review-pluto
on:
  workflow_dispatch:
  schedule:
    - cron: '31 */12 * * *'
permissions:
  contents: read
concurrency:
  group: iptv-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate and refresh against current publication
        env:
          REFRESH_MODE: pluto
          PUBLIC_RESOLVER_ORIGIN: https://zapper-pluto-flex.chevosky.workers.dev
        run: python publication/scripts/refresh.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-pluto-sanitized-result
          path: publication-review.json
          if-no-files-found: error
