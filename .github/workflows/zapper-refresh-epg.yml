name: Zapper refresh-epg
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'publication/scripts/build_flex_guide.py'
      - 'publication/scripts/guia_telefe.py'
      - 'publication/tests/test_guia_telefe.py'
      - 'publication/tests/test_guia_mega_ficcion.py'
      - 'publication/tests/test_guia_bbc_xumo.py'
      - 'publication/scripts/refresh.py'
      - 'publication/scripts/retry-coordinated-publication.sh'
      - 'publication/tests/test_coordinated_publication.py'
      - 'publication/scripts/refresh_expansion.py'
      - 'scripts/build_iptvorg_channels.py'
      - 'scripts/merge_xmltv.py'
      - 'scripts/merge_freeepg_fallbacks.py'
      - 'freeepg-fallbacks.json'
      - 'favorites-test.m3u'
      - 'publication/tests/test_xmltv_format.py'
      - 'publication/tests/test_epg_freshness.py'
      - 'publication/tests/test_channel_policy.py'
      - 'publication/tests/test_expansion_refresh.py'
      - 'publication/scripts/public_*.py'
      - 'publication/scripts/pluto_hls.py'
      - 'publication/scripts/infomaniak_hls.py'
      - 'publication/scripts/qatar_hls.py'
      - 'publication/tests/test_qatar_fallback.py'
      - 'publication/tests/test_pluto_fallbacks.py'
      - 'publication/tests/test_public_fallbacks.py'
      - 'publication/tests/test_public_hls_video.py'
      - 'publication/tests/test_public_hls_rolling.py'
      - 'publication/tests/test_public_hls_reviewed_segments.py'
      - 'publication/tests/test_lineup_logos.py'
      - 'publication/scripts/directos_youtube.py'
      - 'publication/scripts/directos_youtube_anonimos.py'
      - 'publication/tests/test_directos_youtube.py'
      - 'publication/tests/test_youtube_fallbacks.py'
      - 'publication/tests/test_native_youtube_fallbacks.py'
      - 'publication/scripts/filter_expansion.py'
      - 'publication/scripts/flex_sports.py'
      - 'publication/sports/flex-direct-bindings.json'
      - 'publication/tests/test_flex_sports.py'
      - 'publication/scripts/order_lineup.py'
      - 'publication/scripts/guide_history.py'
      - 'publication/scripts/guide_continuity.py'
      - 'publication/tests/test_guide_history.py'
      - 'publication/scripts/guia_*.py'
      - 'publication/epg/**'
      - '.github/workflows/zapper-refresh-epg.yml'
      - 'publication/scripts/validate_zapper_guide.py'
      - 'publication/scripts/validate_flex.py'
      - 'publication/scripts/xmltv_format.py'
      - 'publication/scripts/pluto_identity.py'
      - 'publication/scripts/epg_freshness.py'
      - 'publication/scripts/channel_policy.py'
      - 'publication/channel-policy.json'
      - 'zapper-flex.m3u'
      - 'publication/baseline/pluto-epg-59.json'
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: iptv-publish
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh exact EPG before the coordinated release
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          exact_epg="$RUNNER_TEMP/zapper-exact-iptvorg-epg"
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git "$exact_epg"
          python scripts/build_iptvorg_channels.py "$exact_epg"
          mkdir -p "$RUNNER_TEMP/zapper-exact-batches"
          shopt -s nullglob
          batches=(iptvorg-batches/*.channels.xml)
          test "${#batches[@]}" -gt 0
          (
            cd "$exact_epg"
            npm ci
            for channels in "$GITHUB_WORKSPACE"/iptvorg-batches/*.channels.xml; do
              site="$(basename "$channels" .channels.xml)"
              output="$RUNNER_TEMP/zapper-exact-batches/${site}.xml"
              set +e
              npm run grab -- --channels="$channels" --output="$output" --days=1 --maxConnections=3 --timeout=20000
              status=$?
              set -e
              if [ "$status" -ne 0 ]; then
                echo "::warning::Exact EPG batch ${site} exited ${status}; continuing with independent sources"
              fi
            done
          )
          python scripts/merge_xmltv.py "$RUNNER_TEMP/zapper-exact-batches" guide-iptvorg-exact.xml
          python scripts/merge_freeepg_fallbacks.py
      - name: Install official public YouTube resolver
        if: ${{ hashFiles('publication/epg/expansion-seed.json') != '' }}
        continue-on-error: true
        run: |
          python -m venv "$RUNNER_TEMP/zapper-ytdlp"
          "$RUNNER_TEMP/zapper-ytdlp/bin/python" -m pip install "yt-dlp[default]==2026.8.19"
      - name: Ensure FFmpeg is available for public fallback checks
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Validate and refresh against current publication
        env:
          REFRESH_MODE: epg
          GRABBER_REVISION: ae9cc64f9497c602ec2f6e17857ae38b3aa1ff05
          PUBLIC_RESOLVER_ORIGIN: https://zapper-pluto-flex.chevosky.workers.dev
          ZAPPER_YOUTUBE_DATA_API_KEY: ${{ secrets.ZAPPER_YOUTUBE_DATA_API_KEY }}
          ZAPPER_YOUTUBE_YTDLP: ${{ runner.temp }}/zapper-ytdlp/bin/yt-dlp
        run: |
          bash publication/scripts/retry-coordinated-publication.sh bash -euo pipefail -c '
            python -m unittest discover -s publication/tests -p "test_xmltv_format.py" -v
            python -m unittest discover -s publication/tests -p "test_coordinated_publication.py" -v
            python -m unittest discover -s publication/tests -p "test_epg_freshness.py" -v
            python -m unittest discover -s publication/tests -p "test_guia_telefe.py" -v
            python -m unittest discover -s publication/tests -p "test_guia_mega_ficcion.py" -v
            python -m unittest discover -s publication/tests -p "test_guia_bbc_xumo.py" -v
            python -m unittest discover -s publication/tests -p "test_channel_policy.py" -v
            python -m unittest discover -s publication/tests -p "test_expansion_refresh.py" -v
            python -m unittest discover -s publication/tests -p "test_directos_youtube.py" -v
            python -m unittest discover -s publication/tests -p "test_youtube_fallbacks.py" -v
            python -m unittest discover -s publication/tests -p "test_native_youtube_fallbacks.py" -v
            python -m unittest discover -s publication/tests -p "test_flex_sports.py" -v
            python -m unittest discover -s publication/tests -p "test_public_fallbacks.py" -v
            python -m unittest discover -s publication/tests -p "test_public_hls_video.py" -v
            python -m unittest discover -s publication/tests -p "test_public_hls_rolling.py" -v
            python -m unittest discover -s publication/tests -p "test_public_hls_reviewed_segments.py" -v
            python -m unittest discover -s publication/tests -p "test_pluto_fallbacks.py" -v
            python -m unittest discover -s publication/tests -p "test_qatar_fallback.py" -v
            python -m unittest discover -s publication/tests -p "test_lineup_logos.py" -v
            python -m unittest discover -s publication/tests -p "test_guide_history.py" -v
            export ZAPPER_EXPANSION_BATCHES
            ZAPPER_EXPANSION_BATCHES="$(mktemp -d "$RUNNER_TEMP/expansion-batches.XXXXXX")"
            if [[ -f publication/epg/expansion-seed.json ]]; then
              grabber="$(mktemp -d "$RUNNER_TEMP/iptv-org-epg.XXXXXX")"
              git init "$grabber"
              git -C "$grabber" fetch --depth 1 https://github.com/iptv-org/epg.git "$GRABBER_REVISION"
              git -C "$grabber" checkout --detach FETCH_HEAD
              test "$(git -C "$grabber" rev-parse HEAD)" = "$GRABBER_REVISION"
              (
                cd "$grabber"
                npm ci
                if ! npm run grab -- --channels="$GITHUB_WORKSPACE/publication/epg/expansion-iptvorg.channels.xml" \
                  --output="$ZAPPER_EXPANSION_BATCHES/{site}.xml" --days=1 --maxConnections=3 --timeout=12000; then
                  echo "::warning::IPTV-org guide grab failed; validating any batch files and direct providers"
                fi
              )
            fi
            python publication/scripts/refresh.py
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-epg-sanitized-result
          path: publication-review.json
          if-no-files-found: error

