name: Generate EPG Mapping Candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "favorites-test.m3u"
      - "coverage-favorites.json"
      - "guide.xml"
      - "scripts/generate_mapping_candidates.py"
      - ".github/workflows/mapping-candidates.yml"

permissions:
  contents: write

concurrency:
  group: mapping-candidates
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate mapping candidates
        run: python scripts/generate_mapping_candidates.py

      - name: Publish report
        run: |
          if git diff --quiet -- mapping-candidates.json && git ls-files --error-unmatch mapping-candidates.json >/dev/null 2>&1; then
            echo "No mapping changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapping-candidates.json
          git commit -m "Update EPG mapping candidates"
          git push
