name: Generate EPG Mapping Candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "favorites-test.m3u"
      - "coverage-favorites.json"
      - "guide.xml"
      - "scripts/generate_mapping_candidates.py"
      - "scripts/brand_inventory.py"
      - ".github/workflows/mapping-candidates.yml"

permissions:
  contents: write

concurrency:
  group: iptv-mapping
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate mapping candidates
        run: python scripts/generate_mapping_candidates.py

      - name: Generate brand inventory
        run: python scripts/brand_inventory.py

      - name: Publish report
        run: |
          mkdir -p /tmp/iptv-publish
          cp mapping-candidates.json brand-inventory.json /tmp/iptv-publish/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/iptv-publish/* .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapping-candidates.json brand-inventory.json
          if git diff --cached --quiet; then
            echo "No mapping changes."
            exit 0
          fi
          git commit -m "Update EPG mapping candidates"
          git push
