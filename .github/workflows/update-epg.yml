name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "scripts/build_epg.py"
      - ".github/workflows/update-epg.yml"

permissions:
  contents: write

concurrency:
  group: update-epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build consolidated XMLTV
        run: python scripts/build_epg.py

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("guide.xml")
          root = ET.parse(p).getroot()
          channels = len(root.findall("channel"))
          programmes = len(root.findall("programme"))
          print(f"guide.xml: {channels} channels / {programmes} programmes / {p.stat().st_size/1024/1024:.1f} MB")
          if channels == 0 or programmes == 0:
              raise SystemExit("Guide is empty")
          PY

      - name: Publish guide.xml
        run: |
          if git diff --quiet -- guide.xml && git ls-files --error-unmatch guide.xml >/dev/null 2>&1; then
            echo "No guide changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml
          git commit -m "Update EPG guide"
          git push
